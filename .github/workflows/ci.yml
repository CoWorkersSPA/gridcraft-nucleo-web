# Construye el núcleo web de GridCraft y, con una etiqueta v<versión>-<n>, lo publica como release (tar.gz + SHA-256).
# Quien lo consume (bff: apps/gridcraft/nucleo.json) fija la versión y la suma SHA-256 de esa release.
name: Núcleo web

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nucleo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  construir:
    runs-on: self-hosted
    timeout-minutes: 40
    permissions:
      contents: write # solo lo usa el paso de publicar, con etiqueta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # wasm-bindgen-cli y wasm-opt tardan en compilarse: se guardan entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-opt
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nucleo-${{ runner.os }}-${{ hashFiles('UPSTREAM', 'Cargo.lock', 'scripts/construir.sh') }}
      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/construir.sh "${{ steps.version.outputs.version }}"
      - name: Prueba de humo del paquete
        run: node scripts/probar.mjs "trabajo/gridcraft-nucleo-web-${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-nucleo-web-${{ steps.version.outputs.version }}
          path: salida/
          retention-days: 14
      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El runner propio no trae `gh`: se publica con la API (curl).
          sum="$(cut -d' ' -f1 salida/*.tar.gz.sha256)"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          cuerpo="$(jq -n --arg tag "$GITHUB_REF_NAME" --arg nombre "Núcleo web ${GITHUB_REF_NAME#v}" \
            --arg notas "SHA-256 del paquete: \`$sum\`. Para usarlo en bff, fijar esta versión y esta suma en apps/gridcraft/nucleo.json." \
            '{tag_name: $tag, name: $nombre, body: $notas}')"
          id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/releases" -d "$cuerpo" | jq -r .id)"
          for f in salida/*.tar.gz salida/*.tar.gz.sha256; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$f")" >/dev/null
          done
