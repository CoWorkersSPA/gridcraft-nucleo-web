[package]
name = "gridcraft-web-core"
description = "GridCraft para el navegador: el motor (gridcraft-engine) detrás de wasm-bindgen, sin interfaz de Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gridcraft-engine = { git = "https://github.com/storytold/gridcraft.git", rev = "f86aec12dabc744b5f75e1033f87bfe685e78481" }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
